<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tsukimi Yachiyo (月見ヤチヨ) — 3D Motion Studio</title>
  <style>
    :root {
      --bg-dark: #0a0c14;
      --card-bg: rgba(18, 22, 36, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f5d4;
      --accent-pink: #ff2a85;
      --accent-purple: #7928ca;
      --text-main: #f0f4fc;
      --text-muted: #8a99b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Top Navigation HUD */
    .header-bar {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 245, 212, 0.15);
      color: var(--accent-cyan);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-live .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    .header-title h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .header-title p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Quick Camera Presets */
    .camera-hud {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 10;
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 12px;
    }

    .cam-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cam-btn:hover, .cam-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Motion Control Deck */
    .control-deck {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 960px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .deck-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .motion-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text-main);
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .motion-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 245, 212, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 245, 212, 0.15);
    }

    .motion-btn.active {
      background: linear-gradient(135deg, rgba(0, 245, 212, 0.2), rgba(121, 40, 202, 0.3));
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.3);
    }

    .motion-btn .btn-icon {
      font-size: 18px;
    }

    .motion-btn .btn-sub {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Sub Controls Row */
    .sub-controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .chips-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn:hover, .chip-btn.active {
      background: rgba(255, 42, 133, 0.2);
      border-color: var(--accent-pink);
      color: #fff;
    }

    .speak-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .speak-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: #fff;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }

    .speak-input:focus {
      border-color: var(--accent-cyan);
    }

    .speak-btn {
      background: var(--accent-cyan);
      color: #050b14;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .speak-btn:hover {
      background: #33ffdd;
      transform: scale(1.04);
      box-shadow: 0 0 16px rgba(0, 245, 212, 0.5);
    }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 245, 212, 0.15);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--text-muted);
    }
  </style>

  <!-- Import maps for modern Three.js & three-vrm -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-status">กำลังโหลดโมเดล Tsukimi Yachiyo VRM...</div>
  </div>

  <div id="canvas-container"></div>

  <!-- Top Info HUD -->
  <div class="header-bar">
    <div class="badge-live">
      <div class="pulse-dot"></div>
      Live 3D Vessel
    </div>
    <div class="header-title">
      <h1>Tsukimi Yachiyo (月見ヤチヨ)</h1>
      <p>54 Bones Rigged • 14 Expressions • SpringBone Physics</p>
    </div>
  </div>

  <!-- Camera Presets -->
  <div class="camera-hud">
    <button class="cam-btn active" onclick="setCameraView('full')">Full Body</button>
    <button class="cam-btn" onclick="setCameraView('upper')">Upper Body</button>
    <button class="cam-btn" onclick="setCameraView('face')">Face Focus</button>
  </div>

  <!-- Motion Control Deck -->
  <div class="control-deck">
    <div class="deck-section-title">
      <span>3D Humanoid Motions & Gestures</span>
      <span id="motion-status" style="color: var(--text-muted); font-size: 10px;">Status: Idle Breath</span>
    </div>

    <!-- Motion Buttons Grid -->
    <div class="deck-grid">
      <button class="motion-btn active" id="btn-idle" onclick="switchMotion('idle')">
        <span class="btn-icon">🌸</span>
        <span>Idle Breath</span>
        <span class="btn-sub">หายใจ & โยกตัวนุ่มนวล</span>
      </button>

      <button class="motion-btn" id="btn-wave" onclick="switchMotion('wave')">
        <span class="btn-icon">👋</span>
        <span>Wave Greet</span>
        <span class="btn-sub">โบกมือทักทายเจ้านาย</span>
      </button>

      <button class="motion-btn" id="btn-cheer" onclick="switchMotion('cheer')">
        <span class="btn-icon">✨</span>
        <span>Cheer & Joy</span>
        <span class="btn-sub">กระโดดดีใจชูสองแขน</span>
      </button>

      <button class="motion-btn" id="btn-dance" onclick="switchMotion('dance')">
        <span class="btn-icon">🎵</span>
        <span>Dance Groove</span>
        <span class="btn-sub">เต้นโยกตามจังหวะเพลง</span>
      </button>

      <button class="motion-btn" id="btn-think" onclick="switchMotion('think')">
        <span class="btn-icon">💡</span>
        <span>Think / Pose</span>
        <span class="btn-sub">โพสท่าครุ่นคิดจับคาง</span>
      </button>

      <button class="motion-btn" id="btn-bow" onclick="switchMotion('bow')">
        <span class="btn-icon">🙇‍♀️</span>
        <span>Japanese Bow</span>
        <span class="btn-sub">โค้งคำนับขอบคุณ</span>
      </button>
    </div>

    <!-- Sub Controls: Expressions & Voice Lip-Sync -->
    <div class="sub-controls-row">
      <div class="chips-group">
        <span style="font-size: 11px; color: var(--text-muted); margin-right: 4px;">สีหน้า:</span>
        <button class="chip-btn active" onclick="setExpression('neutral')">Neutral</button>
        <button class="chip-btn" onclick="setExpression('happy')">Joy (ยิ้มหวาน)</button>
        <button class="chip-btn" onclick="setExpression('relaxed')">Relaxed (สบายใจ)</button>
        <button class="chip-btn" onclick="setExpression('surprised')">Surprised (ตกใจ)</button>
        <button class="chip-btn" onclick="setExpression('angry')">Angry (ดุ)</button>
        <button class="chip-btn" onclick="setExpression('sad')">Sad (เศร้า)</button>
      </div>

      <!-- TTS Lip-Sync Simulation -->
      <div class="speak-box">
        <input type="text" id="speak-text" class="speak-input" value="สวัสดีค่ะเจ้านาย โนบีมารายงานตัวแล้วค่ะ!" placeholder="พิมพ์ข้อความให้ขยับปากพูด...">
        <button class="speak-btn" onclick="triggerSpeechLipSync()">🗣️ สั่งให้พูด & ขยับปาก</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    let scene, camera, renderer, controls, currentVrm = null;
    let clock = new THREE.Clock();
    let currentMotion = 'idle';
    let currentExpression = 'neutral';
    let isSpeaking = false;
    let speechTimer = 0;

    // Mouse Tracking for Eye / Head LookAt
    const mouse = new THREE.Vector2();
    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    init();

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scene Setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0c14);
      scene.fog = new THREE.FogExp2(0x0a0c14, 0.08);

      // 2. Camera Setup
      camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.25, 3.4);

      // 3. Renderer Setup with Cinematic Tone Mapping
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. Orbit Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.95, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 0.8;
      controls.maxDistance = 6.0;
      controls.maxPolarAngle = Math.PI / 2 + 0.05;

      // 5. Studio 3-Point Lighting & Anime Tone
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      // Warm Key Light
      const keyLight = new THREE.DirectionalLight(0xfff4e6, 2.2);
      keyLight.position.set(1.5, 2.5, 2.5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.bias = -0.0001;
      scene.add(keyLight);

      // Cool Cyan Fill Light
      const fillLight = new THREE.DirectionalLight(0x00f5d4, 1.4);
      fillLight.position.set(-2, 1.8, 1.5);
      scene.add(fillLight);

      // Vibrant Magenta Rim Backlight
      const rimLight = new THREE.DirectionalLight(0xff2a85, 2.8);
      rimLight.position.set(0, 2.8, -2.5);
      scene.add(rimLight);

      // Bottom Soft Bounce
      const bounceLight = new THREE.DirectionalLight(0x7928ca, 0.8);
      bounceLight.position.set(0, -1, 1);
      scene.add(bounceLight);

      // Reflective Grid Floor
      const grid = new THREE.GridHelper(20, 40, 0x00f5d4, 0x1f273d);
      grid.position.y = 0;
      scene.add(grid);

      // Floor Shadow Catcher
      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 12),
        new THREE.ShadowMaterial({ opacity: 0.35 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);

      // 6. Load VRM Model
      loadVRM('model.vrm');

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function loadVRM(url) {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      const statusEl = document.getElementById('loading-status');

      loader.load(
        url,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          currentVrm = vrm;

          // Rotate VRM to face camera (VRM standard is facing +Z, in Three.js front is facing -Z)
          vrm.scene.rotation.y = Math.PI;

          // Enable shadows on all meshes
          vrm.scene.traverse((obj) => {
            if (obj.isMesh) {
              obj.castShadow = true;
              obj.receiveShadow = true;
            }
          });

          scene.add(vrm.scene);

          // Hide loading screen
          const overlay = document.getElementById('loading-overlay');
          overlay.style.opacity = '0';
          setTimeout(() => overlay.style.display = 'none', 500);

          console.log('Tsukimi Yachiyo VRM Loaded Successfully!', vrm);
        },
        (progress) => {
          if (progress.total > 0) {
            const pct = Math.round((progress.loaded / progress.total) * 100);
            statusEl.innerText = `กำลังโหลดโมเดล Tsukimi Yachiyo... ${pct}%`;
          }
        },
        (error) => {
          console.error('Failed to load VRM:', error);
          statusEl.innerText = 'เกิดข้อผิดพลาดในการโหลดโมเดล: ' + error.message;
        }
      );
    }

    // Kinematic Procedural Animations
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (currentVrm) {
        // Natural Eye Blinking Cycle (Every 3.8s)
        const blinkInterval = 3.8;
        const blinkPhase = time % blinkInterval;
        if (blinkPhase < 0.15) {
          const blinkWeight = Math.sin((blinkPhase / 0.15) * Math.PI);
          currentVrm.expressionManager?.setValue('blink', blinkWeight);
        } else {
          currentVrm.expressionManager?.setValue('blink', 0);
        }

        // Apply Kinematic Motion
        applyProceduralMotion(currentVrm, time);

        // Apply Voice Lip-Sync if speaking
        if (isSpeaking) {
          applyLipSync(currentVrm, time);
        }

        // Update VRM (Physics & Internal transforms)
        currentVrm.update(delta);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function applyProceduralMotion(vrm, t) {
      const humanoid = vrm.humanoid;
      if (!humanoid) return;

      const spine = humanoid.getNormalizedBoneNode('spine');
      const chest = humanoid.getNormalizedBoneNode('chest');
      const neck = humanoid.getNormalizedBoneNode('neck');
      const head = humanoid.getNormalizedBoneNode('head');
      const hips = humanoid.getNormalizedBoneNode('hips');
      const leftUpperArm = humanoid.getNormalizedBoneNode('leftUpperArm');
      const rightUpperArm = humanoid.getNormalizedBoneNode('rightUpperArm');
      const leftLowerArm = humanoid.getNormalizedBoneNode('leftLowerArm');
      const rightLowerArm = humanoid.getNormalizedBoneNode('rightLowerArm');
      const leftHand = humanoid.getNormalizedBoneNode('leftHand');
      const rightHand = humanoid.getNormalizedBoneNode('rightHand');
      const leftUpperLeg = humanoid.getNormalizedBoneNode('leftUpperLeg');
      const rightUpperLeg = humanoid.getNormalizedBoneNode('rightUpperLeg');

      // Head Mouse Tracking look-at (smooth clamp)
      if (head) {
        const targetHeadX = THREE.MathUtils.clamp(-mouse.y * 0.25, -0.3, 0.3);
        const targetHeadY = THREE.MathUtils.clamp(-mouse.x * 0.4, -0.5, 0.5);
        head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, targetHeadX, 0.08);
        head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, targetHeadY, 0.08);
      }

      switch (currentMotion) {
        case 'idle':
          // Subtle rhythmic breathing
          if (chest) chest.rotation.x = Math.sin(t * 1.8) * 0.035;
          if (spine) spine.rotation.y = Math.sin(t * 0.9) * 0.02;
          if (leftUpperArm) {
            leftUpperArm.rotation.z = THREE.MathUtils.degToRad(70) + Math.sin(t * 1.8) * 0.025;
            leftUpperArm.rotation.x = Math.sin(t * 0.9) * 0.02;
          }
          if (rightUpperArm) {
            rightUpperArm.rotation.z = THREE.MathUtils.degToRad(-70) - Math.sin(t * 1.8) * 0.025;
            rightUpperArm.rotation.x = -Math.sin(t * 0.9) * 0.02;
          }
          if (hips) hips.position.y = Math.sin(t * 1.8) * 0.008;
          break;

        case 'wave':
          // Cheerful Wave to dj
          if (chest) chest.rotation.y = 0.1;
          if (rightUpperArm) {
            rightUpperArm.rotation.z = THREE.MathUtils.degToRad(-25);
            rightUpperArm.rotation.x = THREE.MathUtils.degToRad(-120);
          }
          if (rightLowerArm) {
            rightLowerArm.rotation.y = THREE.MathUtils.degToRad(-85);
            rightLowerArm.rotation.z = Math.sin(t * 8.0) * 0.35; // Fast Wave Motion
          }
          if (rightHand) {
            rightHand.rotation.z = Math.sin(t * 8.0) * 0.25;
          }
          if (leftUpperArm) {
            leftUpperArm.rotation.z = THREE.MathUtils.degToRad(68);
          }
          if (head) {
            head.rotation.z = 0.08; // cute tilt
          }
          break;

        case 'cheer':
          // High-Energy Cheer / Dual Arms Raised
          const bounce = Math.abs(Math.sin(t * 5.0));
          if (hips) hips.position.y = bounce * 0.06;
          if (leftUpperArm) {
            leftUpperArm.rotation.z = THREE.MathUtils.degToRad(15);
            leftUpperArm.rotation.x = THREE.MathUtils.degToRad(-140);
          }
          if (rightUpperArm) {
            rightUpperArm.rotation.z = THREE.MathUtils.degToRad(-15);
            rightUpperArm.rotation.x = THREE.MathUtils.degToRad(-140);
          }
          if (leftLowerArm) leftLowerArm.rotation.z = Math.sin(t * 10.0) * 0.2;
          if (rightLowerArm) rightLowerArm.rotation.z = -Math.sin(t * 10.0) * 0.2;
          break;

        case 'dance':
          // Dynamic Groove Dance
          const danceBeat = t * 4.0;
          if (hips) {
            hips.position.y = Math.abs(Math.sin(danceBeat)) * 0.04;
            hips.rotation.y = Math.sin(danceBeat * 0.5) * 0.25;
            hips.rotation.z = Math.cos(danceBeat * 0.5) * 0.12;
          }
          if (chest) {
            chest.rotation.y = -Math.sin(danceBeat * 0.5) * 0.18;
          }
          if (leftUpperArm) {
            leftUpperArm.rotation.z = THREE.MathUtils.degToRad(45) + Math.sin(danceBeat) * 0.3;
            leftUpperArm.rotation.x = Math.cos(danceBeat) * 0.4;
          }
          if (rightUpperArm) {
            rightUpperArm.rotation.z = THREE.MathUtils.degToRad(-45) - Math.sin(danceBeat) * 0.3;
            rightUpperArm.rotation.x = -Math.cos(danceBeat) * 0.4;
          }
          break;

        case 'think':
          // Pondering pose / hand near chin
          if (rightUpperArm) {
            rightUpperArm.rotation.z = THREE.MathUtils.degToRad(-40);
            rightUpperArm.rotation.x = THREE.MathUtils.degToRad(-90);
          }
          if (rightLowerArm) {
            rightLowerArm.rotation.y = THREE.MathUtils.degToRad(-110);
          }
          if (leftUpperArm) {
            leftUpperArm.rotation.z = THREE.MathUtils.degToRad(70);
          }
          if (head) {
            head.rotation.x = -0.15;
            head.rotation.z = -0.1;
          }
          break;

        case 'bow':
          // Japanese Polite Bow
          const bowCycle = Math.sin(t * 1.5);
          const bowAngle = THREE.MathUtils.clamp(bowCycle * 0.45, 0, 0.45);
          if (spine) spine.rotation.x = bowAngle;
          if (chest) chest.rotation.x = bowAngle * 0.8;
          if (leftUpperArm) leftUpperArm.rotation.z = THREE.MathUtils.degToRad(72);
          if (rightUpperArm) rightUpperArm.rotation.z = THREE.MathUtils.degToRad(-72);
          break;
      }
    }

    // Dynamic Lip-Sync Viseme Player
    function applyLipSync(vrm, t) {
      const em = vrm.expressionManager;
      if (!em) return;

      // Realistic speech modulation over time
      const freq = t * 14.0;
      const aa = Math.max(0, Math.sin(freq) * 0.95);
      const ee = Math.max(0, Math.sin(freq + 1.2) * 0.6);
      const oh = Math.max(0, Math.sin(freq + 2.5) * 0.8);

      em.setValue('aa', aa);
      em.setValue('ee', ee);
      em.setValue('oh', oh);
    }

    // UI Window Bridge Functions
    window.switchMotion = function(motion) {
      currentMotion = motion;
      document.querySelectorAll('.motion-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + motion);
      if (activeBtn) activeBtn.classList.add('active');

      const statusMap = {
        idle: 'Status: Idle Breath (หายใจตามธรรมชาติ)',
        wave: 'Status: Wave Greet (โบกมือทักทายเจ้านาย)',
        cheer: 'Status: Cheer & Joy (กระโดดดีใจ)',
        dance: 'Status: Dance Groove (เต้นตามจังหวะ)',
        think: 'Status: Think / Ponder (กำลังคิดวิเคราะห์)',
        bow: 'Status: Japanese Bow (โค้งคำนับ)'
      };
      document.getElementById('motion-status').innerText = statusMap[motion] || '';

      // Auto smile on wave / cheer
      if (motion === 'wave' || motion === 'cheer') {
        setExpression('happy');
      } else if (motion === 'think') {
        setExpression('surprised');
      } else {
        setExpression('neutral');
      }
    };

    window.setExpression = function(expr) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      currentExpression = expr;

      // Clear all emotional expressions
      ['happy', 'relaxed', 'surprised', 'angry', 'sad'].forEach(name => {
        currentVrm.expressionManager.setValue(name, 0);
      });

      if (expr !== 'neutral') {
        currentVrm.expressionManager.setValue(expr, 1.0);
      }

      // Update chip UI
      document.querySelectorAll('.chip-btn').forEach(btn => {
        if (btn.innerText.toLowerCase().includes(expr)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    };

    window.triggerSpeechLipSync = function() {
      const text = document.getElementById('speak-text').value;
      if (!text) return;

      isSpeaking = true;
      switchMotion('wave');

      // Use Web Speech Synthesis if available
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'th-TH';
        utterance.rate = 1.05;
        utterance.onend = () => {
          stopSpeaking();
        };
        utterance.onerror = () => {
          stopSpeaking();
        };
        window.speechSynthesis.speak(utterance);
      } else {
        // Fallback simulated duration
        setTimeout(() => stopSpeaking(), 3500);
      }
    };

    function stopSpeaking() {
      isSpeaking = false;
      if (currentVrm && currentVrm.expressionManager) {
        currentVrm.expressionManager.setValue('aa', 0);
        currentVrm.expressionManager.setValue('ee', 0);
        currentVrm.expressionManager.setValue('oh', 0);
      }
      switchMotion('idle');
    }

    window.setCameraView = function(view) {
      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (view === 'full') {
        controls.target.set(0, 0.95, 0);
        camera.position.set(0, 1.25, 3.4);
      } else if (view === 'upper') {
        controls.target.set(0, 1.25, 0);
        camera.position.set(0, 1.35, 1.8);
      } else if (view === 'face') {
        controls.target.set(0, 1.38, 0);
        camera.position.set(0, 1.42, 0.95);
      }
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
